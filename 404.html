<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>document.documentElement.className+=' js-loading';setTimeout(function(){var d=document.documentElement;d.className=d.className.replace('js-loading','')},2500)</script>

  <title>صفحه پیدا نشد (۴۰۴) | مهراز سنج شرق</title>
  <meta name="description" content="صفحه‌ای که به دنبال آن بودید پیدا نشد؛ به صفحه اصلی یا خدمات پروژه‌های مهراز سنج شرق بروید." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('no-motion')</script>
</head>
<body>

  <!-- boot preloader: painted before CSS/JS bundles; removed by main.js -->
  <div id="boot-preloader" data-no-rewrite aria-hidden="true">
    <style>
      #boot-preloader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#f7f4ee}
      #boot-preloader .bp-logo{width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid rgb(30 34 41/.12);animation:bp-pulse 1.6s ease-in-out infinite}
      #boot-preloader .bp-brand{font-family:Vazirmatn,'Segoe UI',Tahoma,sans-serif;font-size:.95rem;font-weight:800;color:#1e2229}
      #boot-preloader .bp-track{width:148px;height:2px;overflow:hidden;background:rgb(30 34 41/.1);border-radius:2px;position:relative}
      #boot-preloader .bp-fill{position:absolute;inset-block:0;width:40%;background:#d4af37;border-radius:2px;animation:bp-slide 1.1s cubic-bezier(.45,0,.55,1) infinite}
      @keyframes bp-pulse{0%,100%{opacity:1}50%{opacity:.55}}
      @keyframes bp-slide{0%{left:-40%}100%{left:100%}}
    </style>
    <img class="bp-logo" src="/images/brand/logo.png" alt="" width="64" height="64" />
    <span class="bp-brand">مهراز سنج شرق</span>
    <span class="bp-track"><span class="bp-fill"></span></span>
  </div>

  <noscript><style>.reveal { opacity: 1 }</style></noscript>

  <header id="site-nav" class="site-nav"></header>

  <main id="main">
    <section class="relative min-h-svh flex items-center overflow-hidden blueprint-grid">
      <div class="wrap relative text-center py-32">
        <p class="num font-mono font-extrabold text-gold/70 text-[clamp(6rem,18vw,13rem)] leading-none select-none" aria-hidden="true">۴۰۴</p>
        <h1 class="mt-6 text-h1 font-extrabold text-ink">این مختصات، خارج از نقشه پروژه است.</h1>
        <p class="mt-6 text-muted leading-9 max-w-xl mx-auto">
          صفحه‌ای که به دنبال آن بودید پیدا نشد یا نشانی آن تغییر کرده است. از مسیرهای زیر به نقشه اصلی برگردید.
        </p>
        <div class="mt-10 flex flex-wrap justify-center gap-4">
          <a href="/index.html" class="btn btn-primary">بازگشت به صفحه اصلی</a>
          <a href="/services/index.html" class="btn btn-ghost">مشاهده خدمات</a>
          <a href="/projects/index.html" class="btn btn-ghost">پروژه‌های اجرایی</a>
          <a href="/contact.html" class="btn btn-ghost">تماس با ما</a>
        </div>
        <p class="mt-12 en-note text-muted/70">ERROR REF: 404 — PAGE NOT FOUND</p>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="section-dark relative overflow-hidden"></footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
